<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>לומדות ציפורניים</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3ea"/><stop offset=".55" stop-color="#f3d4ff"/><stop offset="1" stop-color="#d9e4ff"/>
    </linearGradient>
    <linearGradient id="polish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8cc0"/><stop offset="1" stop-color="#e0368f"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b5cff"/><stop offset=".5" stop-color="#b98bff"/><stop offset="1" stop-color="#7b2cbf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="400" cy="120" r="92" fill="#fff" opacity=".35"/>
  <circle cx="96" cy="420" r="70" fill="#c8f3ee" opacity=".7"/>
  <!-- cap -->
  <rect x="206" y="62" width="100" height="150" rx="30" fill="url(#cap)"/>
  <rect x="222" y="78" width="16" height="116" rx="8" fill="#fff" opacity=".45"/>
  <!-- neck -->
  <rect x="190" y="200" width="132" height="34" rx="12" fill="#f7e9ff" stroke="#c9a6ff" stroke-width="5"/>
  <!-- glass body -->
  <rect x="128" y="226" width="256" height="226" rx="62" fill="#fff" opacity=".9"/>
  <rect x="142" y="240" width="228" height="198" rx="50" fill="url(#polish)"/>
  <!-- shine -->
  <path d="M166 288 q0 -26 26 -30 l14 -2 q-22 18 -22 60 l0 70 q-18 -4 -18 -24z" fill="#fff" opacity=".55"/>
  <!-- heart -->
  <path d="M256 404 l-42 -40 c-26 -25 -6 -66 26 -50 c8 4 12 10 16 16 c4 -6 8 -12 16 -16 c32 -16 52 25 26 50z" fill="#fff"/>
  <!-- sparkles -->
  <path d="M410 238 q6 30 36 36 q-30 6 -36 36 q-6 -30 -36 -36 q30 -6 36 -36z" fill="#fff"/>
  <path d="M98 150 q5 22 26 26 q-21 4 -26 26 q-4 -22 -26 -26 q22 -4 26 -26z" fill="#ffd166"/>
  <path d="M120 300 q3 13 16 16 q-13 3 -16 16 q-3 -13 -16 -16 q13 -3 16 -16z" fill="#fff"/>
  <circle cx="420" cy="380" r="9" fill="#ffd166"/>
</svg>
